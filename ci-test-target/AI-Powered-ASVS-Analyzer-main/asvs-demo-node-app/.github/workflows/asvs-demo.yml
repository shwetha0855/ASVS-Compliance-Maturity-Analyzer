name: ASVS Demo Application

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: npm test

      # In your capstone demo, replace/extend this step with your project's cli.js
      # and configured ASVS maturity threshold.
