name: ASVS Compliance Gate

on:
  pull_request:
    branches: [main, master]

jobs:
  asvs-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run ASVS Compliance Scan
        id: scan
        run: |
          node cli.js --path . --min-level "Level 1" --project "${{ github.repository }}" | tee scan_output.txt
        continue-on-error: true

      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('scan_output.txt', 'utf8');
            const passed = output.includes('✅ PASS');
            const body = [
              `## ${passed ? '✅' : '❌'} ASVS Compliance Scan`,
              '```',
              output.trim(),
              '```',
              '',
              passed
                ? '_Maturity threshold met — no action required._'
                : '_This PR does not meet the minimum ASVS maturity level. Review the gaps above before merging._'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail the check if scan failed
        run: |
          if grep -q "❌ FAIL" scan_output.txt; then
            echo "ASVS compliance gate failed — see PR comment for details."
            exit 1
          fi
